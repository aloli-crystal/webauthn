name: webauthn
version: 0.1.0

description: |
  WebAuthn (Web Authentication, W3C Level 3) relying-party library for
  Crystal: registration and authentication ceremonies, CBOR and COSE key
  decoding, ES256 and RS256 signature verification. Passkeys without a
  shared secret on the server.

authors:
  - Philippe Nénert <philippe@aloli.fr>

crystal: ">= 1.19.0"

license: MIT

dependencies:
  jose:
    github: aloli-crystal/jose
    version: "~> 0.2"

development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
